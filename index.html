<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>شحن سوريا</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D8%B4%D8%AD%D9%86%20%D8%B3%D9%88%D8%B1%D9%8A%D8%A7%22%2C%22display%22%3A%22standalone%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22ar%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#38bdf8;--at:#04202c;--bg:#0f172a;--c:#1e293b;--c2:#273449;--t:#f1f5f9;--m:#94a3b8;--ok:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:500 15px/1.5 Tajawal,Tahoma,sans-serif;min-height:100%;padding-bottom:76px}
body.syr{--a:#e30613;--at:#fff}body.mtn{--a:#ffcc00;--at:#1a1400}
.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px 4px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.sw{display:flex;background:var(--c);border-radius:12px;padding:3px}
.sw button{flex:1;background:none;border:0;color:var(--m);font:700 13px Tajawal;padding:7px;border-radius:10px}
.sw .on{background:var(--a);color:var(--at)}
.bal{background:var(--c);border-radius:14px;padding:6px 12px;font-weight:800}
.plus{background:var(--a);color:var(--at);border:0;border-radius:50%;width:30px;height:30px;font:800 18px Tajawal}
.tk{overflow:hidden;white-space:nowrap;background:var(--c);border-radius:10px;margin-top:8px;padding:5px 0;color:var(--a);font-size:13px}
.tk span{display:inline-block;padding-inline-start:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.tk span{animation:none;padding:0 10px}}
input,select,textarea{width:100%;background:var(--bg);border:2px solid var(--c2);color:var(--t);border-radius:12px;padding:11px;font:500 15px Tajawal;margin:4px 0}
input:focus,select:focus{outline:none;border-color:var(--a)}
.num{font-size:22px;letter-spacing:2px;text-align:center;direction:ltr}
.btn{background:var(--a);color:var(--at);border:0;border-radius:12px;padding:12px;font:800 15px Tajawal;width:100%;margin-top:6px}
.btn.s{width:auto;padding:7px 12px;font-size:13px;margin:0}.btn.g{background:var(--c2);color:var(--t)}.btn.ok{background:var(--ok);color:#04130a}.btn.no{background:var(--no);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{flex:none;background:var(--c2);color:var(--t);border:2px solid transparent;border-radius:20px;padding:7px 14px;font:700 13px Tajawal}
.chip.on{border-color:var(--a);color:var(--a)}.chip.off{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amt{background:var(--c2);border:2px solid transparent;color:var(--t);border-radius:12px;padding:10px 4px;font:700 14px Tajawal;text-align:center}
.amt small{display:block;color:var(--m);font-weight:400}.amt.on{border-color:var(--a)}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--c);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--c2);z-index:6}
.nav button{flex:1;background:none;border:0;color:var(--m);font:700 11px Tajawal;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav b{font-size:20px}.nav .on{color:var(--a)}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--c2)}.li:last-child{border:0}
.m{color:var(--m);font-size:12px}
.bd{border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.pending{background:#f59e0b33;color:#fbbf24}.done{background:#22c55e33;color:#4ade80}.rejected{background:#ef444433;color:#f87171}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--c);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.big{font:800 30px Tajawal;direction:ltr;text-align:center;color:var(--a);letter-spacing:3px;margin:8px 0}
.stat{background:var(--c);border-radius:16px;padding:12px}.stat b{display:block;font-size:19px;font-weight:800}
.tbl{overflow-x:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--t);color:#0f172a;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30}
.tg{width:48px;height:26px;border-radius:13px;background:var(--c2);border:0;position:relative}.tg i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--m)}.tg.on{background:var(--ok)}.tg.on i{background:#fff;inset-inline-start:25px}
label{font-size:13px;color:var(--m)}
@media(min-width:760px){body{max-width:760px;margin:auto}.nav{max-width:760px;margin:auto}}
</style>
</head>
<body>
<div id="app"></div><div id="mo"></div>
<script>
const $=s=>document.querySelector(s),N=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}),NW=n=>(Math.round(n)/100).toLocaleString('en-US',{maximumFractionDigits:2}),L=n=>N(n)+' ل.س',T=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const NET={syr:'سيريتل',mtn:'MTN'},TIER=['مفرق','معتمد','جملة'];
const seed=()=>({mode:'user',tab:'home',at:'dash',cur:1,net:{syr:true,mtn:true},
ticker:'أهلاً بكم — شحن فوري على مدار الساعة، وأسعار خاصة للمعتمدين',
users:[{id:1,name:'أنت (معتمد تجريبي)',phone:'0933000111',bal:3500,tier:1,limit:0,ban:false},{id:2,name:'محمد الخطيب',phone:'0944555666',bal:12000,tier:2,limit:5000,ban:false},{id:3,name:'ليلى حداد',phone:'0988123123',bal:450,tier:0,limit:0,ban:false},{id:4,name:'نقطة بيع الميدان',phone:'0955777888',bal:7800,tier:1,limit:2000,ban:false}],
prices:{syr:[11,10.6,10.3],mtn:[10.9,10.5,10.2]},cost:{syr:10,mtn:9.95},pct:4,
orders:[{id:1001,uid:4,uname:'نقطة بيع الميدان',net:'syr',num:'0933123456',type:'وحدات',item:'25,000 وحدة',qty:25000,price:265,profit:15,status:'pending',time:'10:42'}],
deps:[{id:1,uid:3,uname:'ليلى حداد',method:'سيريتل كاش',ref:'884201937',amt:1000,status:'pending',time:'10:30'}],
stmt:[{uid:1,desc:'رصيد افتتاحي',before:0,amt:3500,after:3500,time:'08:00'}],contacts:[{n:'أبو خالد',num:'0933111222'},{n:'المحل',num:'0944222333'}],
pkgs:[{id:1,name:'إنترنت 5GB',net:'syr',cat:'إنترنت',price:250,code:'*111*5#'},{id:2,name:'إنترنت 20GB',net:'syr',cat:'إنترنت',price:800,code:'*111*20#'},{id:3,name:'مكالمات 1000 دقيقة',net:'syr',cat:'مكالمات',price:300,code:'*222*1#'},{id:4,name:'سوشيال ميديا شهري',net:'syr',cat:'سوشيال',price:150,code:'*333*1#'},{id:5,name:'باقة الطالب 10GB',net:'mtn',cat:'طلاب',price:350,code:'*444*10#'},{id:6,name:'إنترنت 10GB',net:'mtn',cat:'إنترنت',price:450,code:'*555*10#'},{id:7,name:'مكالمات 500 دقيقة',net:'mtn',cat:'مكالمات',price:180,code:'*666*5#'},{id:8,name:'سوشيال + واتساب',net:'mtn',cat:'سوشيال',price:120,code:'*777*1#'}],
set:{scash:'0933 000 111',mcash:'0944 000 222',sham:'0988 000 333',harm:'الهرم — فرع الحمرا',bot:'',chat:'',hook:'',uS:'*150*1234*{qty}*{num}#',uM:'*135*1234*{qty}*{num}#'}});
let S;try{S=JSON.parse(localStorage.getItem('sy4'))}catch(e){}S=S||seed();S.cm=S.cm||'both';S.den=S.den||{syr:[1000,2500,5000,7500,10000,15000,25000,50000,100000],mtn:[1000,3000,5000,10000,15000,25000,50000,100000]};
const ui={svc:'units',net:'',num:'',units:0,cat:'إنترنت',q:''};
const save=()=>{try{localStorage.setItem('sy4',JSON.stringify(S))}catch(e){}};
const me=()=>S.users.find(u=>u.id==S.cur),usr=id=>S.users.find(u=>u.id==id);
const tr=(u,desc,amt)=>{const b=u.bal;u.bal+=amt;S.stmt.unshift({uid:u.id,desc,before:b,amt,after:u.bal,time:T()})};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};
const mdl=h=>{$('#mo').innerHTML=`<div class="ov" onclick="if(event.target==this)cm()"><div class="sh">${h}</div></div>`},cm=()=>$('#mo').innerHTML='';
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}};
const det=n=>['093','098','099'].includes(n.slice(0,3))?'syr':['094','095','096'].includes(n.slice(0,3))?'mtn':'';
const pr=(net,u)=>Math.round(u/1000*S.prices[net][me().tier]*100)/100;
const cp=t=>{try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'))}catch(e){toast('انسخ يدوياً: '+t)}};
function go(m){S.mode=m;S.tab='home';save();render();if(m=='admin'&&S.orders.some(o=>o.status=='pending'))beep()}
function tab(t){S.tab=t;ui.num='';ui.net='';ui.units=0;save();render()}
function skin(){document.body.className=S.mode=='user'?ui.net:''}
function render(){
const u=me(),ad=S.mode=='admin';
$('#app').innerHTML=`<div class="top"><div class="sw"><button class="${!ad?'on':''}" onclick="go('user')">واجهة المستخدم</button><button class="${ad?'on':''}" onclick="go('admin')">لوحة الأدمن</button></div>
${ad?`<div class="row sp" style="margin-top:8px"><b style="font-size:17px">لوحة التحكم</b><span class="m">${new Date().toLocaleDateString('ar-SY')}</span></div>`:`<div class="row sp" style="margin-top:8px"><b style="font-size:18px">⚡ شحن سوريا</b><div class="row"><div class="bal">${L(u.bal)}</div><button class="plus" onclick="tab('wallet')">+</button></div></div><div class="tk"><span>${S.ticker}</span></div>`}</div>
<div id="body">${ad?admin():user()}</div>${ad?'':`<div class="nav">${[['home','🏠','الرئيسية'],['orders','📋','الطلبات'],['stmt','🧾','كشف الحساب'],['wallet','💳','شحن المحفظة'],['me','👤','حسابي']].map(([k,i,l])=>`<button class="${S.tab==k?'on':''}" onclick="tab('${k}')"><b>${i}</b>${l}</button>`).join('')}</div>`}`;
skin();if(!ad&&S.tab=='home')dyn()}
/* ---------- USER ---------- */
function user(){const u=me();
if(u.ban)return`<div class="card">حسابك محظور. تواصل مع الإدارة.</div>`;
if(S.tab=='home')return`<div class="card"><label>رقم الموبايل / الخط</label><input id="num" class="num" inputmode="numeric" maxlength="10" placeholder="09XXXXXXXX" value="${ui.num}" oninput="onNum(this)">
<div class="row">${['syr','mtn'].map(n=>`<button id="b-${n}" class="chip ${ui.net==n?'on':''} ${S.net[n]?'':'off'}" style="flex:1" onclick="setNet('${n}')">${NET[n]}${S.net[n]?'':' (متوقفة)'}</button>`).join('')}<button class="chip" onclick="book()">📒 الدفتر</button></div></div>
<div class="card"><div class="chips">${[['units','وحدات مسبق'],['bill','فاتورة لاحق'],['pkgs','باقات'],['adsl','ADSL'],['util','كهرباء ومياه']].map(([k,l])=>`<button class="chip ${ui.svc==k?'on':''}" onclick="ui.svc='${k}';render()">${l}</button>`).join('')}</div><div id="dyn"></div></div>`;
if(S.tab=='orders')return`<div class="card">${S.orders.filter(o=>o.uid==u.id).map(o=>`<div class="li"><div><b>${o.item}</b> <span class="m">${NET[o.net]||o.net}</span><div class="m" dir="ltr" style="text-align:right">${o.num} · ${o.time}</div>${o.reason?`<div class="m" style="color:var(--no)">السبب: ${o.reason}</div>`:''}</div><div style="text-align:left"><span class="bd ${o.status}">${{pending:'قيد الانتظار',done:'مكتمل',rejected:'مرفوض'}[o.status]}</span><div>${L(o.price)}</div>${o.status=='done'?`<button class="btn s g" onclick="receipt(${o.id})">🧾 إيصال</button>`:''}</div></div>`).join('')||'<p class="m">لا توجد طلبات بعد. جرّب شحن رصيد من الرئيسية.</p>'}</div>`;
if(S.tab=='stmt')return`<div class="card">${S.stmt.filter(s=>s.uid==u.id).map(s=>`<div class="li"><div>${s.desc}<div class="m">${s.time} · قبل ${N(s.before)} ← بعد ${N(s.after)}</div></div><b style="color:${s.amt<0?'var(--no)':'var(--ok)'};direction:ltr">${s.amt>0?'+':''}${N(s.amt)}</b></div>`).join('')}</div>`;
if(S.tab=='wallet')return`<div class="card"><b>تعبئة المحفظة</b><p class="m">حوّل المبلغ إلى أحد الأرقام ثم أدخل رقم العملية.</p>
${[['سيريتل كاش',S.set.scash],['MTN كاش',S.set.mcash],['شام كاش',S.set.sham],['الهرم',S.set.harm]].map(([n,v])=>`<div class="li"><span>${n}</span><b dir="ltr">${v}</b></div>`).join('')}
<select id="dm">${['سيريتل كاش','MTN كاش','شام كاش','الهرم'].map(x=>`<option>${x}</option>`).join('')}</select><input id="da" inputmode="numeric" placeholder="المبلغ (ل.س جديدة)"><input id="dr" placeholder="رقم عملية التحويل"><button class="btn" onclick="deposit()">إرسال الطلب</button></div>
<div class="card"><b>طلباتي السابقة</b>${S.deps.filter(d=>d.uid==u.id).map(d=>`<div class="li"><span>${d.method} · ${L(d.amt)}</span><span class="bd ${d.status}">${{pending:'قيد المراجعة',done:'تمت',rejected:'مرفوض'}[d.status]}</span></div>`).join('')||'<p class="m">لا يوجد</p>'}</div>`;
return`<div class="card"><b>${u.name}</b><div class="m">${u.phone}</div><div class="li"><span>الفئة</span><b>${TIER[u.tier]}</b></div><div class="li"><span>الرصيد</span><b>${L(u.bal)}</b></div><div class="li"><span>سقف الدين</span><b>${L(u.limit)}</b></div></div>
<div class="card"><b>دفتر الزبائن</b>${S.contacts.map((c,i)=>`<div class="li"><span>${c.n}</span><span dir="ltr">${c.num} <a href="#" style="color:var(--no)" onclick="S.contacts.splice(${i},1);save();render();return false">✕</a></span></div>`).join('')}<input id="cn" placeholder="الاسم"><input id="cu" inputmode="numeric" placeholder="الرقم"><button class="btn g" onclick="addC()">حفظ الزبون</button></div>
<div class="card"><button class="btn g" onclick="if(confirm('إعادة ضبط كل البيانات التجريبية؟')){S=seed();save();render()}">إعادة ضبط البيانات التجريبية</button></div>`}
function onNum(el){ui.num=el.value.replace(/\D/g,'');el.value=ui.num;const d=det(ui.num);if(d&&d!=ui.net)setNet(d,1);}
function setNet(n,keep){ui.net=n;skin();['syr','mtn'].forEach(x=>{const b=$('#b-'+x);if(b)b.classList.toggle('on',ui.net==x)});dyn()}
function book(){mdl(`<b>اختر زبوناً</b>${S.contacts.map(c=>`<div class="li" onclick="ui.num='${c.num}';cm();render();setNet(det('${c.num}'))"><span>${c.n}</span><b dir="ltr">${c.num}</b></div>`).join('')||'<p class="m">الدفتر فارغ</p>'}`)}
function addC(){const n=$('#cn').value,u=$('#cu').value;if(!n||u.length!=10)return toast('أدخل الاسم ورقماً من 10 خانات');S.contacts.push({n,num:u});save();render()}
function dyn(){const d=$('#dyn');if(!d)return;const s=ui.svc,n=ui.net;let h='';
if(s=='units'){h=!n?'<p class="m">اكتب رقم الموبايل لتظهر فئات الرصيد: 093 / 098 / 099 سيريتل، 094 / 095 / 096 MTN.</p>':`<b>فئات ${NET[n]}</b><div class="grid" style="margin-top:6px">${S.den[n].map(x=>`<button class="amt ${ui.units==x?'on':''}" onclick="ui.units=${x};dyn()">${N(x)} وحدة<small>${n?L(pr(n,x)):'اختر الشبكة'}</small></button>`).join('')}</div><input id="cu2" inputmode="numeric" placeholder="كمية مخصصة" value="${S.den[n].includes(ui.units)?'':ui.units||''}" oninput="ui.units=+this.value||0;$('#pp').textContent=ui.net?L(pr(ui.net,ui.units)):'-'"><div class="row sp" style="margin-top:6px"><span>السعر حسب فئتك (${TIER[me().tier]})</span><b id="pp">${n&&ui.units?L(pr(n,ui.units)):'-'}</b></div><button class="btn" onclick="reqUnits()">متابعة</button>`}
if(s=='bill'){h=`<input id="ba" inputmode="numeric" placeholder="مبلغ الفاتورة (ل.س جديدة)" oninput="$('#bt').textContent=L(Math.round(+this.value*(1+S.pct/100)*100)/100)"><div class="row sp"><span>عمولة ${S.pct}% — الإجمالي</span><b id="bt">-</b></div><button class="btn" onclick="reqBill()">متابعة</button>`}
if(s=='pkgs'){const cats=['إنترنت','مكالمات','سوشيال','طلاب'];h=`<div class="chips">${cats.map(c=>`<button class="chip ${ui.cat==c?'on':''}" onclick="ui.cat='${c}';dyn()">${c}</button>`).join('')}</div>`+(n?S.pkgs.filter(p=>p.net==n&&p.cat==ui.cat).map(p=>`<div class="li"><div><b>${p.name}</b><div class="m">${NET[p.net]}</div></div><button class="btn s" onclick="reqPkg(${p.id})">${L(p.price)}</button></div>`).join('')||'<p class="m">لا باقات في هذا التصنيف</p>':'<p class="m">اكتب الرقم لاختيار الشبكة تلقائياً.</p>')}
if(s=='adsl'){h=`<select id="ag">${['011 دمشق','021 حلب','031 حمص','033 حماة','041 اللاذقية','043 طرطوس','051 دير الزور','052 الحسكة'].map(x=>`<option>${x}</option>`).join('')}</select><input id="ap" inputmode="numeric" placeholder="رقم الهاتف الأرضي"><select id="av">${['تراسل','آية','إينت','سوا','رن نت','أمنية'].map(x=>`<option>${x}</option>`).join('')}</select><input id="aa" inputmode="numeric" placeholder="المبلغ"><button class="btn" onclick="reqAdsl()">متابعة</button>`}
if(s=='util'){h=`<select id="ut"><option>فاتورة كهرباء</option><option>فاتورة مياه</option></select><input id="up" inputmode="numeric" placeholder="رقم الاشتراك"><input id="ua" inputmode="numeric" placeholder="المبلغ"><button class="btn" onclick="reqUtil()">متابعة</button>`}
d.innerHTML=h}
function chk(){const n=ui.net;if(ui.num.length!=10||!det(ui.num))return toast('أدخل رقماً صحيحاً من 10 خانات'),0;if(!S.net[n])return toast('شبكة '+NET[n]+' متوقفة مؤقتاً'),0;return 1}
function reqUnits(){if(!chk())return;if(ui.units<1000)return toast('اختر كمية');const p=pr(ui.net,ui.units);ask({net:ui.net,num:ui.num,type:'وحدات',item:N(ui.units)+' وحدة',qty:ui.units,price:p,profit:Math.round((p-ui.units/1000*S.cost[ui.net])*100)/100})}
function reqBill(){if(!chk())return;const a=+$('#ba').value;if(a<10)return toast('أدخل المبلغ');const p=Math.round(a*(1+S.pct/100)*100)/100;ask({net:ui.net,num:ui.num,type:'فاتورة',item:'فاتورة '+L(a),qty:a,price:p,profit:p-a})}
function reqPkg(id){if(!chk())return;const k=S.pkgs.find(x=>x.id==id);ask({net:ui.net,num:ui.num,type:'باقة',item:k.name,qty:0,price:k.price,profit:Math.round(k.price*4)/100})}
function reqAdsl(){const p=$('#ap').value,a=+$('#aa').value;if(p.length<6||a<10)return toast('أكمل البيانات');ask({net:'adsl',num:$('#ag').value.split(' ')[0]+'-'+p,type:'ADSL',item:$('#av').value+' — '+L(a),qty:a,price:a+5,profit:5})}
function reqUtil(){const p=$('#up').value,a=+$('#ua').value;if(p.length<4||a<10)return toast('أكمل البيانات');ask({net:'util',num:p,type:'فاتورة',item:$('#ut').value+' — '+L(a),qty:a,price:a+3,profit:3})}
let pend=null;
function ask(o){pend=o;mdl(`<b>تأكيد الطلب</b><div class="m">${o.net=='adsl'||o.net=='util'?'رقم الخدمة':'الرقم المطلوب شحنه'}</div><div class="big" ${S.mode&&''}>${o.num}</div><div class="li"><span>${o.item}</span><b>${L(o.price)}</b></div><p class="m">راجع الرقم جيداً — لا يمكن التراجع بعد التنفيذ.</p><div class="row"><button class="btn g" onclick="cm()">تعديل</button><button class="btn" onclick="submit()">تأكيد وإرسال</button></div>`)}
function submit(){const u=me(),o=pend;if(u.bal-o.price<-u.limit){cm();return toast('الرصيد غير كافٍ')}tr(u,o.type+' '+o.item+' — '+o.num,-o.price);const id=1000+S.orders.length+Math.floor(Math.random()*900)+1;S.orders.unshift({...o,id,uid:u.id,uname:u.name,status:'pending',time:T()});save();cm();ui.num='';ui.units=0;toast('تم إرسال الطلب ✓');S.tab='orders';render()}
function deposit(){const a=+$('#da').value,r=$('#dr').value;if(a<10||r.length<4)return toast('أدخل المبلغ ورقم العملية');S.deps.unshift({id:Date.now(),uid:me().id,uname:me().name,method:$('#dm').value,ref:r,amt:a,status:'pending',time:T()});save();toast('أُرسل الطلب للأدمن');render()}
function receipt(id){const o=S.orders.find(x=>x.id==id),c=document.createElement('canvas');c.width=600;c.height=720;const x=c.getContext('2d');x.fillStyle='#0f172a';x.fillRect(0,0,600,720);x.fillStyle=o.net=='mtn'?'#ffcc00':o.net=='syr'?'#e30613':'#38bdf8';x.fillRect(0,0,600,14);x.direction='rtl';x.textAlign='center';x.fillStyle='#fff';x.font='700 34px Tajawal,sans-serif';x.fillText('إيصال عملية ناجحة ✓',300,90);x.font='500 22px Tajawal,sans-serif';[['الخدمة',o.type+' '+(NET[o.net]||'')],['التفاصيل',o.item],['المبلغ',L(o.price)],['الوقت',o.time],['رقم الطلب','#'+o.id]].forEach(([k,v],i)=>{x.fillStyle='#94a3b8';x.fillText(k,300,170+i*95);x.fillStyle='#fff';x.fillText(v,300,205+i*95)});x.fillStyle='#ffcc00';x.font='800 40px Tajawal,sans-serif';x.direction='ltr';x.fillText(o.num,300,670);const url=c.toDataURL('image/png');mdl(`<img src="${url}" style="width:100%;border-radius:12px"><p class="m">اضغط مطولاً على الصورة لحفظها، أو شاركها مباشرة.</p><button class="btn ok" onclick="shareR()">مشاركة عبر واتساب</button>`);window._c=c}
function shareR(){window._c.toBlob(async b=>{const f=new File([b],'receipt.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('المشاركة غير مدعومة هنا — احفظ الصورة يدوياً')}catch(e){}})}
/* ---------- ADMIN ---------- */
const AT=[['dash','📊 الإحصائيات'],['q','⚡ الطلبات'],['dep','💰 التعبئة'],['usr','👥 المستخدمون'],['pr','🏷 الأسعار'],['set','⚙️ الإعدادات']];
function admin(){const t=S.at,pq=S.orders.filter(o=>o.status=='pending').length,pd=S.deps.filter(o=>o.status=='pending').length;
let h=`<div class="chips" style="padding:6px 12px">${AT.map(([k,l])=>`<button class="chip ${t==k?'on':''}" onclick="S.at='${k}';save();render()">${l}${k=='q'&&pq?` (${pq})`:''}${k=='dep'&&pd?` (${pd})`:''}</button>`).join('')}</div>`;
if(t=='dash'){const done=S.orders.filter(o=>o.status=='done');h+=`<div class="grid" style="padding:0 12px">${[['مبيعات اليوم',L(done.reduce((a,o)=>a+o.price,0))],['صافي الأرباح',L(done.reduce((a,o)=>a+o.profit,0))],['طلبات قيد الانتظار',pq],['تعبئة معلقة',pd],['أرصدة المعتمدين',L(S.users.reduce((a,u)=>a+u.bal,0))]].map(([k,v])=>`<div class="stat"><span class="m">${k}</span><b>${v}</b></div>`).join('')}</div>
<div class="card"><b>تحكم سريع</b>${['syr','mtn'].map(n=>`<div class="li"><span>شبكة ${NET[n]}</span><button class="tg ${S.net[n]?'on':''}" onclick="S.net.${n}=!S.net.${n};save();render()"><i></i></button></div>`).join('')}<label>نص الشريط الإعلاني</label><input id="tk" value="${S.ticker}"><button class="btn" onclick="S.ticker=$('#tk').value;save();toast('تم الحفظ')">حفظ الإعلان</button></div>`}
if(t=='q')h+=`<div class="card tbl">${S.orders.map(o=>{const u=usr(o.uid),ussd=(o.net=='mtn'?S.set.uM:S.set.uS).replace('{qty}',o.qty).replace('{num}',o.num);return`<div class="li" style="flex-direction:column"><div class="row sp"><b>${o.uname}</b><span class="bd ${o.status}">${{pending:'جديد',done:'مكتمل',rejected:'مرفوض'}[o.status]}</span></div><div>${NET[o.net]||o.net} · <b dir="ltr">${o.num}</b> · ${o.item}</div><div class="m">خُصم ${L(o.price)} · ${o.time} · #${o.id}${o.reason?' · '+o.reason:''}</div>${o.status=='pending'?`${o.net=='syr'||o.net=='mtn'?`<div class="row"><button class="btn s g" onclick="cp('${ussd}')">📋 نسخ USSD</button><a class="btn s g" style="text-decoration:none" href="tel:${ussd.replace(/#/g,'%23')}">📞 اتصال</a></div>`:''}<div class="row"><button class="btn s ok" onclick="acc(${o.id})">✅ تنفيذ وقبول</button><button class="btn s no" onclick="rej(${o.id})">❌ رفض وإرجاع</button></div>`:''}</div>`}).join('')||'<p class="m">لا طلبات</p>'}</div>`;
if(t=='dep')h+=`<div class="card">${S.deps.map(d=>`<div class="li" style="flex-direction:column"><div class="row sp"><b>${d.uname}</b><span class="bd ${d.status}">${{pending:'معلق',done:'تمت',rejected:'مرفوض'}[d.status]}</span></div><div>${d.method} · عملية <b dir="ltr">${d.ref}</b></div><div><b>${L(d.amt)}</b> <span class="m">${d.time}</span></div>${d.status=='pending'?`<div class="row"><button class="btn s ok" onclick="depAct(${d.id},1)">✅ موافقة وإضافة الرصيد</button><button class="btn s no" onclick="depAct(${d.id},0)">❌ رفض</button></div>`:''}</div>`).join('')||'<p class="m">لا طلبات</p>'}</div>`;
if(t=='usr')h+=`<div class="card"><input placeholder="بحث بالاسم أو الرقم" value="${ui.q}" oninput="ui.q=this.value;$('#ul').innerHTML=ulist()"><div id="ul">${ulist()}</div></div>`;
if(t=='pr')h+=`<div class="card"><b>سعر 1000 وحدة</b>${['syr','mtn'].map(n=>`<div class="m" style="margin-top:8px">${NET[n]} (مفرق / معتمد / جملة)</div><div class="row">${[0,1,2].map(i=>`<input inputmode="decimal" id="p-${n}${i}" value="${S.prices[n][i]}">`).join('')}</div>`).join('')}<b style="display:block;margin-top:10px">فئات الرصيد (مفصولة بفاصلة)</b>${['syr','mtn'].map(n=>`<label>${NET[n]}</label><input id="d-${n}" dir="ltr" value="${S.den[n].join(',')}">`).join('')}<label>عمولة تسديد الفواتير %</label><input id="pc" inputmode="numeric" value="${S.pct}"><button class="btn" onclick="savePr()">حفظ الأسعار</button></div>
<div class="card"><div class="row sp"><b>الباقات</b><button class="btn s" onclick="pkgM()">+ باقة</button></div>${S.pkgs.map(p=>`<div class="li"><div>${p.name}<div class="m">${NET[p.net]} · ${p.cat} · <span dir="ltr">${p.code}</span></div></div><div class="row"><b>${N(p.price)}</b><button class="btn s g" onclick="pkgM(${p.id})">✎</button><button class="btn s no" onclick="S.pkgs=S.pkgs.filter(x=>x.id!=${p.id});save();render()">🗑</button></div></div>`).join('')}</div>`;
if(t=='set')h+=`<div class="card">${[['scash','سيريتل كاش'],['mcash','MTN كاش'],['sham','شام كاش'],['bot','Telegram Bot Token'],['chat','Admin Chat ID'],['hook','Webhook بوابة الشرائح (SMS/USSD)'],['uS','قالب USSD سيريتل'],['uM','قالب USSD MTN']].map(([k,l])=>`<label>${l}</label><input id="s-${k}" value="${S.set[k]}" ${/Token|Chat|Webhook/.test(l)?'dir="ltr"':''}>`).join('')}<p class="m">المتغيرات: {qty} الكمية، {num} الرقم. إشعارات تلغرام وWebhook محفوظة كإعدادات في هذه النسخة التجريبية.</p><button class="btn" onclick="['scash','mcash','sham','bot','chat','hook','uS','uM'].forEach(k=>S.set[k]=$('#s-'+k).value);save();toast('تم حفظ الإعدادات')">حفظ</button></div>`;
return h}
function ulist(){const q=ui.q;return S.users.filter(u=>!q||u.name.includes(q)||u.phone.includes(q)).map(u=>`<div class="li" onclick="uM(${u.id})"><div><b>${u.name}</b>${u.ban?' 🚫':''}<div class="m">${u.phone} · ${TIER[u.tier]} · سقف ${N(u.limit)}</div></div><b style="color:${u.bal<0?'var(--no)':'var(--t)'}">${L(u.bal)}</b></div>`).join('')}
function acc(id){const o=S.orders.find(x=>x.id==id);o.status='done';save();toast('تم التنفيذ');render()}
function rej(id){mdl(`<b>سبب الرفض</b><select id="rs" onchange="$('#rt').value=this.value">${['الرقم خارج التغطية','الرقم فاتورة وليس مسبق','رقم غير صحيح','الشبكة تحت الصيانة'].map(x=>`<option>${x}</option>`).join('')}</select><input id="rt" value="الرقم خارج التغطية"><button class="btn no" onclick="doRej(${id})">رفض وإرجاع الرصيد</button>`)}
function doRej(id){const o=S.orders.find(x=>x.id==id);o.status='rejected';o.reason=$('#rt').value;tr(usr(o.uid),'استرجاع طلب #'+o.id+' ('+o.reason+')',o.price);save();cm();toast('أُعيد '+L(o.price)+' للمحفظة');render()}
function depAct(id,ok){const d=S.deps.find(x=>x.id==id);d.status=ok?'done':'rejected';if(ok)tr(usr(d.uid),'تعبئة محفظة — '+d.method,d.amt);save();render()}
function savePr(){['syr','mtn'].forEach(n=>[0,1,2].forEach(i=>S.prices[n][i]=+$('#p-'+n+i).value));S.pct=+$('#pc').value;['syr','mtn'].forEach(n=>S.den[n]=$('#d-'+n).value.split(',').map(x=>+x.trim()).filter(x=>x>0).sort((a,b)=>a-b));save();toast('تم حفظ الأسعار والفئات')}
function pkgM(id){const p=S.pkgs.find(x=>x.id==id)||{name:'',net:'syr',cat:'إنترنت',price:'',code:''};mdl(`<b>${id?'تعديل':'إضافة'} باقة</b><input id="kn" placeholder="اسم الباقة" value="${p.name}"><select id="kt"><option value="syr" ${p.net=='syr'?'selected':''}>سيريتل</option><option value="mtn" ${p.net=='mtn'?'selected':''}>MTN</option></select><select id="kc">${['إنترنت','مكالمات','سوشيال','طلاب'].map(c=>`<option ${p.cat==c?'selected':''}>${c}</option>`).join('')}</select><input id="kp" inputmode="numeric" placeholder="السعر" value="${p.price}"><input id="kk" dir="ltr" placeholder="كود التفعيل" value="${p.code}"><button class="btn" onclick="savePkg(${id||0})">حفظ</button>`)}
function savePkg(id){const o={name:$('#kn').value,net:$('#kt').value,cat:$('#kc').value,price:+$('#kp').value,code:$('#kk').value};if(!o.name||!o.price)return toast('أكمل البيانات');if(id)Object.assign(S.pkgs.find(x=>x.id==id),o);else S.pkgs.push({id:Date.now(),...o});save();cm();render()}
function uM(id){const u=usr(id);mdl(`<b>${u.name}</b><div class="m">${u.phone} · الرصيد ${L(u.bal)}</div><input id="ua2" inputmode="numeric" placeholder="المبلغ"><input id="un" placeholder="ملاحظة"><div class="row"><button class="btn ok" onclick="adj(${id},1)">+ إضافة</button><button class="btn no" onclick="adj(${id},-1)">− سحب</button></div>
<label>رتبة التسعير</label><select id="ut2">${TIER.map((t,i)=>`<option value="${i}" ${u.tier==i?'selected':''}>${['عادي/مفرق','معتمد/نقطة بيع','وكيل جملة'][i]}</option>`).join('')}</select><label>سقف الدين (ل.س)</label><input id="ul2" inputmode="numeric" value="${u.limit}"><div class="row"><button class="btn" onclick="saveU(${id})">حفظ</button><button class="btn g" onclick="usr(${id}).ban=!usr(${id}).ban;save();cm();render()">${u.ban?'تفعيل الحساب':'حظر الحساب'}</button></div>
<b>كشف الحساب</b>${S.stmt.filter(s=>s.uid==id).slice(0,12).map(s=>`<div class="li"><div>${s.desc}<div class="m">قبل ${N(s.before)} ← بعد ${N(s.after)}</div></div><b dir="ltr">${s.amt>0?'+':''}${N(s.amt)}</b></div>`).join('')}`)}
function adj(id,sg){const a=+$('#ua2').value;if(!a)return toast('أدخل المبلغ');tr(usr(id),($('#un').value||'تعديل يدوي من الأدمن'),sg*a);save();cm();render()}
function saveU(id){const u=usr(id);u.tier=+$('#ut2').value;u.limit=+$('#ul2').value||0;save();cm();render();toast('تم الحفظ')}
render();
</script>
</body>
</html>
